[project]
name = "videostudyagent-backend"
version = "0.1.0"
description = "VideoStudyAgent local API and versioned contracts"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "srt>=3.5,<4",
  "webvtt-py>=0.5,<1",
  "httpx>=0.28,<1",
  "filelock>=4.1,<5",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2.1,<2", "av>=11,<19"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=../.cache/pytest"

[tool.ruff]
extend-exclude = ["app/vendor", "tests/vendor"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
